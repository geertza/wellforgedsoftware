```html
<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Rate This App</title>

    <!-- Bootstrap CSS -->
    <link
        href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css"
        rel="stylesheet"
        integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qK9yU8b8N1J2s9R7x9X2"
        crossorigin="anonymous">

</head>


<body class="bg-light">


    <div class="container mt-5 text-center">

        <h1 class="mb-4">
            My App
        </h1>


        <!-- Rate Button -->
        <button
            type="button"
            class="btn btn-primary"
            data-bs-toggle="modal"
            data-bs-target="#ratingModal">

            Rate This App

        </button>

    </div>



    <!-- Rating Modal -->
    <div
        class="modal fade"
        id="ratingModal"
        tabindex="-1"
        aria-labelledby="ratingModalLabel"
        aria-hidden="true">

        <div class="modal-dialog modal-dialog-centered">

            <div class="modal-content">


                <!-- Header -->
                <div class="modal-header">

                    <h5
                        class="modal-title"
                        id="ratingModalLabel">

                        Rate This App

                    </h5>

                    <button
                        type="button"
                        class="btn-close"
                        data-bs-dismiss="modal"
                        aria-label="Close">
                    </button>

                </div>


                <!-- Body -->
                <div class="modal-body text-center">

                    <p class="mb-4">
                        How would you rate this app?
                    </p>


                    <!-- Stars -->
                    <div
                        class="d-flex justify-content-center gap-2"
                        id="ratingStars">

                        <button
                            type="button"
                            class="btn btn-link fs-1 text-secondary p-0 star"
                            data-rating="1">
                            ★
                        </button>

                        <button
                            type="button"
                            class="btn btn-link fs-1 text-secondary p-0 star"
                            data-rating="2">
                            ★
                        </button>

                        <button
                            type="button"
                            class="btn btn-link fs-1 text-secondary p-0 star"
                            data-rating="3">
                            ★
                        </button>

                        <button
                            type="button"
                            class="btn btn-link fs-1 text-secondary p-0 star"
                            data-rating="4">
                            ★
                        </button>

                        <button
                            type="button"
                            class="btn btn-link fs-1 text-secondary p-0 star"
                            data-rating="5">
                            ★
                        </button>

                    </div>


                    <p
                        id="ratingText"
                        class="text-muted mt-3 mb-0">

                        Click a star

                    </p>

                </div>

            </div>

        </div>

    </div>



    <!-- Bootstrap JavaScript -->
    <script
        src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"
        integrity="sha384-ndDqU0Gzau9qJ1lfW4o6e8kGkQ2QvK5bJxG7mJm6rW5m7X9c"
        crossorigin="anonymous">
    </script>



    <script>

        const stars = document.querySelectorAll(".star");
        const ratingText = document.getElementById("ratingText");
        const modalElement = document.getElementById("ratingModal");


        stars.forEach(function(star) {

            star.addEventListener("click", function() {

                const rating = this.dataset.rating;


                // Show selected rating
                ratingText.textContent =
                    "You selected " + rating + " star" +
                    (rating == 1 ? "" : "s");


                // Get Bootstrap modal
                const modal =
                    bootstrap.Modal.getOrCreateInstance(modalElement);


                // Close modal
                modal.hide();


                // Your rating is available here
                console.log("Rating:", rating);

            });

        });

    </script>


</body>

</html>
```
