<section class="bg-dark p-4">
    <link rel="stylesheet" href="css/dnd.css">
    <div class="container bg-white p-4 shadow rounded">
        <form id="charForm" onsubmit="return false;">
            
            <div class="row g-2 mb-4">
                <div class="col-md-4"><label class="form-label fw-bold">Name</label><input type="text" id="charName" class="form-control"></div>
                <div class="col-md-2"><label class="form-label fw-bold">Race</label><select class="form-select"><option>Human</option><option>Elf</option><option>Dwarf</option></select></div>
                <div class="col-md-3"><label class="form-label fw-bold">Class</label><select id="charClass" class="form-select"><option>Fighter</option><option>Wizard</option><option>Rogue</option></select></div>
                <div class="col-md-3"><label class="form-label fw-bold">Alignment</label><select class="form-select"><option>Lawful Good</option><option>True Neutral</option><option>Chaotic Evil</option></select></div>
            </div>

            <!-- 2. Stats Row (Horizontal) -->
            <div class="row g-2 mb-5 text-center bg-light p-3 rounded border">
                <div class="col-2"><label class="small fw-bold">STR</label><input type="number" id="STR" class="form-control text-center stat-input" readonly></div>
                <div class="col-2"><label class="small fw-bold">DEX</label><input type="number" id="DEX" class="form-control text-center stat-input" readonly></div>
                <div class="col-2"><label class="small fw-bold">CON</label><input type="number" id="CON" class="form-control text-center stat-input" readonly></div>
                <div class="col-2"><label class="small fw-bold">INT</label><input type="number" id="INT" class="form-control text-center stat-input" readonly></div>
                <div class="col-2"><label class="small fw-bold">WIS</label><input type="number" id="WIS" class="form-control text-center stat-input" readonly></div>
                <div class="col-2"><label class="small fw-bold">CHA</label><input type="number" id="CHA" class="form-control text-center stat-input" readonly></div>
            </div>

            <!-- 3. Dice Roller Section -->
            <div class="card shadow-sm mx-auto" style="max-width: 600px;">
                <div class="card-header bg-success text-white text-center"><h5 class="mb-0">Stat Roller (4d6 Drop Lowest)</h5></div>
                <div class="card-body text-center">
                    <div id="diceDisplay" class="mb-3 d-flex justify-content-center">
                        <div class="die">?</div><div class="die">?</div><div class="die">?</div><div class="die">?</div>
                    </div>
                    
                    <div class="d-flex gap-2 justify-content-center mb-3">
                        <button type="button" id="rollBtn" class="btn btn-success btn-lg px-5">Roll Dice</button>
                        <button type="button" id="autoBtn" class="btn btn-warning btn-lg d-none">Auto-Assign All</button>
                    </div>
                    
                    <div id="assignArea" class="mt-4 d-none">
                        <p class="mb-2 fw-bold">Total: <span id="currentSumText" class="badge bg-primary fs-5">0</span></p>
                        <div class="d-flex flex-wrap gap-2 justify-content-center" id="buttonGroup">
                            <button type="button" class="btn btn-outline-primary btn-sm assign-btn" data-stat="STR">Assign STR</button>
                            <button type="button" class="btn btn-outline-primary btn-sm assign-btn" data-stat="DEX">Assign DEX</button>
                            <button type="button" class="btn btn-outline-primary btn-sm assign-btn" data-stat="CON">Assign CON</button>
                            <button type="button" class="btn btn-outline-primary btn-sm assign-btn" data-stat="INT">Assign INT</button>
                            <button type="button" class="btn btn-outline-primary btn-sm assign-btn" data-stat="WIS">Assign WIS</button>
                            <button type="button" class="btn btn-outline-primary btn-sm assign-btn" data-stat="CHA">Assign CHA</button>
                        </div>
                    </div>
                </div>
                <div class="card-footer text-end d-none" id="finishArea">
                    <button type="button" class="btn btn-dark" onclick="window.print()">Print Character Sheet</button>
                </div>
            </div>
        </form>
    </div>
    <script src="js/dnd.js"></script>
</section>
<section>
     <div class="container py-5">
        <div class="row justify-content-center">
            <div class="col-md-6">
                <div class="card shadow">
                    <div class="card-body">
                        <h5 class="card-title mb-4 text-center">Remove Lowest Value</h5>
                        <div class="input-group mb-3">
                            <!-- Input Field -->
                            <input type="text" id="userInput" class="form-control" placeholder="10, 5, 8, 2, 7">
                            <!-- REMOVED onclick="processArray()" and added id="submitBtn" -->
                            <button id="submitBtn" class="btn btn-primary" type="button">Submit</button>
                        </div>
                        <div id="result" class="p-3 bg-white border rounded text-center d-none"></div>
                    </div>
                </div>
            </div>
        </div>
    </div>
</section>
